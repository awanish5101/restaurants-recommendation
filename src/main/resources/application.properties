spring.application.name=restaurant

# --- Postgres + pgvector ---
# Defaults match the bundled docker-compose db service; override via env for other hosts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurantdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant}

# Schema is owned by Flyway migrations; Hibernate only maps to it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Seed the catalog from the bundled sample on first boot (empty table only).
app.ingestion.enabled=true

# --- Gemini (LLM) ---
# Secret is injected from the GEMINI_API_KEY environment variable (see .env.example).
# Defaults to empty so the app still boots and falls back gracefully when unset.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# --- Actuator ---
# Only expose health + info (previously '*', which leaked env, mappings, beans, etc.)
management.endpoints.web.exposure.include=health,info

# --- Logging ---
logging.level.org.springframework.web=INFO
