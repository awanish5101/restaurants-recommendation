spring.application.name=restaurant

# --- Data store ---
# NOTE: MongoDB is being migrated to Postgres + pgvector in a later phase.
# These stay env-driven so no host/credentials are ever committed.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/restaurantdb}
spring.data.mongodb.database=${MONGODB_DATABASE:restaurantdb}

# --- Gemini (LLM) ---
# Secret is injected from the GEMINI_API_KEY environment variable (see .env.example).
# Defaults to empty so the app still boots and falls back gracefully when unset.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# --- Actuator ---
# Only expose health + info (previously '*', which leaked env, mappings, beans, etc.)
management.endpoints.web.exposure.include=health,info

# --- Logging ---
logging.level.org.springframework.web=INFO
